# sleep in 45 mins
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=2700000
CONFIG_ZMK_SLEEP=y

# stronger radio: +8 dBm transmit power (default is 0 dBm), applies to both halves
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# in ZMK v0.3 this only disables 2M PHY; 1M PHY is more robust over distance
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
